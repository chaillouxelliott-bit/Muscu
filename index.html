const clone = (o) => JSON.parse(JSON.stringify(o));
const mondayOf = (iso) => { const d = new Date(iso + "T12:00:00"); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return isoLocal(d); };
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoLocal(d); };

/* ================= état ================= */
let cfg = clone(DEFAULT_CFG);
let sessions = [];

const prog = () => cfg.programs[cfg.active] || cfg.programs.B;
/* une séance compte comme faite si tu l'as terminée, ou si elle a des séries et date d'avant aujourd'hui */
const isDone = (s) => s.done || (Object.values(s.sets || {}).some(a => filled(a).length) && s.date < today());
const cycleOrder = () => [...prog().days].sort((a, b) => ((dayWd(a) ?? 7) + 6) % 7 - ((dayWd(b) ?? 7) + 6) % 7);
/* la prochaine séance : celle en cours aujourd'hui, sinon celle qui suit la dernière faite dans l'ordre du programme */
function nextToDo() {
  const order = cycleOrder(); if (!order.length) return null;
  const ids = new Set(order.map(d => d.id));
  const inProgress = sessions.find(s => s.date === today() && !s.done && ids.has(s.day) && Object.values(s.sets || {}).some(a => filled(a).length));
  if (inProgress) return inProgress.day;
  const last = sessions.filter(s => ids.has(s.day) && isDone(s)).sort((a, b) => b.date.localeCompare(a.date) || String(b.updatedAt).localeCompare(String(a.updatedAt)))[0];
  if (!last) return (byNext(order)[0] || order[0]).id;   // pas encore d'historique : la séance prévue la plus proche
  const i = order.findIndex(d => d.id === last.day);
  return order[(i + 1) % order.length].id;
}
const defaultDay = () => nextToDo() || prog().days[0]?.id;
let manualNav = false;       // true quand tu as choisi toi-même un jour ou une date
let sessionsLoaded = false;
function goToNext() { manualNav = false; curDate = today(); curDayByProg[cfg.active] = defaultDay(); }
const curDayId = () => { let id = curDayByProg[cfg.active]; if (!id || !prog().days.find(d => d.id === id)) id = curDayByProg[cfg.active] = defaultDay(); return id; };
const dayObj = () => prog().days.find(d => d.id === curDayId()) || prog().days[0];
/* index des exercices du programme : recalculé seulement après un changement de programme (vidé à chaque rendu) */
let _allEx = null;
const allEx = () => { if (_allEx) return _allEx; const m = {}; Object.values(cfg.programs).forEach(p => p.days.forEach(d => d.ex.forEach(x => m[x.id] = x))); return _allEx = m; };
/* séances triées de la plus récente à la plus ancienne, gardées tant que la liste ne change pas */
let _sd = null, _sdSrc = null;
const sessionsDesc = () => _sdSrc === sessions ? _sd : (_sdSrc = sessions, _sd = [...sessions].sort((a, b) => b.date.localeCompare(a.date)));
const exName = (s, id) => s.names?.[id] || allEx()[id]?.name || null;
const exMuscle = (s, id) => s.muscles?.[id] || allEx()[id]?.muscle || null;
const filled = (arr) => (arr || []).filter(x => x && (x.kg != null || x.reps != null));

/* échanges temporaires : remplacent un exercice pour une seule séance (jour + date), sans toucher au programme */
let tmpSwaps = {};
try { tmpSwaps = JSON.parse(localStorage.getItem("carnet-echanges") || "{}") || {}; } catch (e) {}
const swapKey = (dayId, date) => `${dayId}_${date}`;
function saveTmpSwaps() {
  const lim = addDays(today(), -14);
  Object.keys(tmpSwaps).forEach(k => { if (k.slice(-10) < lim) delete tmpSwaps[k]; });
  try { localStorage.setItem("carnet-echanges", JSON.stringify(tmpSwaps)); } catch (e) {}
}
function swapsFor(dayId, date) {
  const k = swapKey(dayId, date);
  if (k in tmpSwaps) return tmpSwaps[k];
  return sessions.find(s => s.day === dayId && s.date === date)?.swaps || {};
}
function setSwaps(dayId, date, sw) { tmpSwaps[swapKey(dayId, date)] = sw; saveTmpSwaps(); }
const slugName = (n) => norm(n).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30);
/* exercices réellement faits ce jour-là : ceux du programme, avec les échanges du jour appliqués */
function effEx(d, date) {
  const sw = swapsFor(d.id, date);
  return d.ex.map(ex => {
    const t = sw[ex.id]; if (!t) return ex;
    return { ...ex, id: `${ex.id}--t-${slugName(t.name)}`, name: t.name, muscle: t.muscle, reps: t.reps || ex.reps, orig: ex.id, origName: ex.name };
  });
}
const dateLabel = (iso) => `${WD_LABELS[new Date(iso + "T12:00:00").getDay()].toLowerCase()} ${fmtDate(iso)}`;

/* derniers sets connus pour un exercice (même id, sinon même nom), avant une date */
function lastFor(ex, beforeDate) {
  const n = norm(ex.name);
  for (const s of sessionsDesc()) {
    if (s.date >= beforeDate) continue;
    let sets = s.sets?.[ex.id];
    if (!filled(sets).length) {
      const key = Object.keys(s.sets || {}).find(k => norm(exName(s, k)) === n && filled(s.sets[k]).length);
      sets = key ? s.sets[key] : null;
    }
    if (filled(sets).length) return { date: s.date, sets };
  }
  return null;
}

/* ================= stockage ================= */
/* écritures envoyées mais pas encore confirmées : un instantané plus ancien du serveur ne doit pas les annuler à l'écran */
const pending = new Map();   // "jour_date" -> séance enregistrée, ou null si supprimée
function mergePending(list) {
  pending.forEach((want, key) => {
    const i = list.findIndex(x => `${x.day}_${x.date}` === key);
    if (want === null) { if (i < 0) pending.delete(key); else list.splice(i, 1); }
    else if (i >= 0 && list[i].updatedAt === want.updatedAt) pending.delete(key);
    else if (i >= 0) list[i] = want; else list.push(want);
  });
  return list;
}
const store = {
  mode: "local", db: null, cfgVersionSeen: false,
  async init() {
    let db = null;
    try { db = window.claude?.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (db) {
      this.db = db; this.mode = "db";
      db.collection("seances").orderBy("date", "desc").limit(1000).onSnapshot(
        (snap) => { sessions = mergePending(snap.docs.map(d => d.data())); if (!sessionsLoaded) { sessionsLoaded = true; if (!manualNav) { goToNext(); if (tab === "seance") { render(); return; } } } refresh("sessions"); },
        () => setStatus("Connexion perdue : recharge la page pour retrouver tes données."));
      db.doc("config/profil").onSnapshot((snap) => { if (snap.exists) { profil = snap.data() || {}; refresh("weights"); } }, () => {});
      db.collection("poids").orderBy("date", "asc").limit(1000).onSnapshot(
        (snap) => { weights = snap.docs.map(d => d.data()); refresh("weights"); }, () => {});
      db.doc("config/programme").onSnapshot((snap) => { if (snap.exists && cfgFromStore(snap.data())) refresh("cfg"); }, () => {});
    } else {
      setStatus("Données enregistrées sur cet appareil. Pense à les exporter de temps en temps (⚙️ Réglages).");
      try { sessions = JSON.parse(localStorage.getItem("carnet-seances") || "[]"); } catch (e) {}
      try { weights = JSON.parse(localStorage.getItem("carnet-poids") || "[]"); } catch (e) {}
      try { profil = JSON.parse(localStorage.getItem("carnet-profil") || "{}") || {}; } catch (e) {}
      try { const c = JSON.parse(localStorage.getItem("carnet-prog") || "null"); if (c) applyCfg(c); } catch (e) {}
      sessionsLoaded = true; goToNext();
      refresh("all");
    }
  },
  _ls(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} },
  /* la liste locale est mise à jour tout de suite : l'écran reflète l'action sans attendre le serveur */
  async saveSession(s) {
    sessions = sessions.filter(x => !(x.day === s.day && x.date === s.date)).concat([s]);
    if (s.swaps && swapKey(s.day, s.date) in tmpSwaps) { delete tmpSwaps[swapKey(s.day, s.date)]; saveTmpSwaps(); }
    if (this.mode === "db") pending.set(`${s.day}_${s.date}`, s);
    if (this.mode === "db") return this.db.collection("seances").doc(`${s.day}_${s.date}`).set(s);
    this._ls("carnet-seances", sessions);
  },
  async deleteSession(day, date) {
    sessions = sessions.filter(x => !(x.day === day && x.date === date));
    if (swapKey(day, date) in tmpSwaps) { delete tmpSwaps[swapKey(day, date)]; saveTmpSwaps(); }
    if (this.mode === "db") pending.set(`${day}_${date}`, null);
    if (this.mode === "db") return this.db.collection("seances").doc(`${day}_${date}`).delete();
    this._ls("carnet-seances", sessions);
  },
  async saveWeight(w) {
    if (this.mode === "db") weights = weights.filter(x => x.date !== w.date).concat([w]).sort((a, b) => a.date.localeCompare(b.date));
    if (this.mode === "db") return this.db.collection("poids").doc(w.date).set(w);
    weights = weights.filter(x => x.date !== w.date).concat([w]).sort((a, b) => a.date.localeCompare(b.date));
    this._ls("carnet-poids", weights);
  },
  async deleteWeight(date) {
    if (this.mode === "db") weights = weights.filter(x => x.date !== date);
    if (this.mode === "db") return this.db.collection("poids").doc(date).delete();
    weights = weights.filter(x => x.date !== date); this._ls("carnet-poids", weights);
  },
  async saveProfil(p) {
    profil = p;
    if (this.mode === "db") return this.db.doc("config/profil").set(p);
    this._ls("carnet-profil", p);
  },
  async saveCfg(c) {
    if (this.mode === "db") return this.db.doc("config/programme").set(c);
    this._ls("carnet-prog", c);
  }
};
let lastCfgJson = "", localSavedAt = 0;
function cfgFromStore(c) {
  const j = JSON.stringify(c);
  if (j === lastCfgJson) return false;                 // rien de nouveau
  if ((c.savedAt || 0) < localSavedAt) return false;   // plus ancien que notre dernière modif
  lastCfgJson = j; applyCfg(c); return true;
}
function applyCfg(c) {
  _allEx = null;
  if (c.programs) { cfg = { ...clone(c), active: c.active || "B", savedAt: c.savedAt || 0, programs: { ...clone(DEFAULT_CFG.programs), ...clone(c.programs) } }; }
  else if (c.days) { cfg = clone(DEFAULT_CFG); cfg.programs.B.days = c.days; } // ancienne version du carnet
}
let cfgWriting = false, cfgPending = false;
/* garde la trace des jours prévus pour que le calendrier passé ne change pas quand tu modifies tes jours */
function updatePlanHistory() {
  const wds = prog().days.map(dayWd).filter(x => x != null).sort();
  const ph = cfg.planHistory ||= [];
  const last = ph[ph.length - 1];
  if (last && last.wds.join() === wds.join()) return;
  if (last && last.from === today()) last.wds = wds;
  else ph.push({ from: ph.length ? today() : "0000-01-01", wds });
}
async function persistCfg(msg) {
  updatePlanHistory(); _allEx = null;
  cfg.savedAt = localSavedAt = Date.now();
  lastCfgJson = JSON.stringify(cfg);
  if (msg) toast(msg);
  if (cfgWriting) { cfgPending = true; return; }   // une écriture à la fois : la suivante part avec l'état le plus récent
  cfgWriting = true;
  try {
    do { cfgPending = false; const data = clone(cfg); lastCfgJson = JSON.stringify(data); await store.saveCfg(data); } while (cfgPending);
  } catch (e) { toast("Échec de l'enregistrement du programme : réessaie"); }
  finally { cfgWriting = false; }
}

function setStatus(t) { $("#status").textContent = t; }

/* ================= rendu principal ================= */
function refresh(reason) {
  if (drag || picker) return;
  if (settingsOpen && (reason === "weights" || reason === "all") && !document.activeElement?.matches?.("#settings input, #settings textarea")) renderSettings();
  /* ne redessine que l'onglet concerné par la donnée qui a changé */
  const concerns = { sessions: ["seance", "historique"], weights: ["historique"], cfg: ["seance", "historique", "programme"], all: ["seance", "historique", "programme"] }[reason] || [];
  if (!concerns.includes(tab)) return;
  if (tab === "seance" && reason !== "all") {
    const typing = document.activeElement?.matches?.("#view input, #view textarea");
    if (typing || (reason === "sessions" && hasTyped() && $("#view .sets"))) { renderHistOnly(); return; }
  }
  if ((tab === "historique" || tab === "programme") && document.activeElement?.matches?.("#view input")) return;
  render();
}
function render() {
  _allEx = null;
  $$("#nav button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  const v = $("#view");
  if (tab === "seance") { v.innerHTML = viewSeance(); updateKcal(); }
  else if (tab === "historique") v.innerHTML = viewHistorique();
  else v.innerHTML = viewProgramme();
  armed = null;
}

function dayTabs() {

  return `<nav class="tabs" style="--n:${p.days.length}" role="tablist">${byNext(p.days).map(d => { const nx = d.id === next; const dn = sessions.some(s => s.day === d.id && isDone(s) && s.date >= since);
    return `<button class="tab ${nx ? "next" : ""}" role="tab" aria-selected="${d.id === cur}" data-day="${d.id}"><b>${esc(p.days.length > 4 ? d.label.slice(0, 3) : d.label)}${dn ? " ✓" : ""}</b><span>${nx ? "▶ À faire" : esc(d.title)}</span></button>`; }).join("")}</nav>`;
}
const setLine = (sets) => filled(sets).map(x => `${fmtNum(x.kg) || "–"}×${x.reps ?? "–"}`).join(" · ");

let composingFlag = false; // mode "composer la séance"
let moreOpen = null;       // ligne dont les options sont ouvertes

const tkey = (id) => `${curDate}|${dayObj()?.id}|${id}`;
const val = (id, fallback) => (tkey(id) in typed ? typed[tkey(id)] : fallback);
let autoT = null, autoBusy = null;
function hasTyped() { const p = `${curDate}|${dayObj()?.id}|`; return Object.keys(typed).some(k => k.startsWith(p)); }
function scheduleAutosave() { clearTimeout(autoT); autoT = setTimeout(() => flushAutosave(), 1500); }
/* enregistre la séance affichée si quelque chose a été tapé ; appelé avant tout changement de jour, date ou onglet */
async function flushAutosave() {
  clearTimeout(autoT); autoT = null;
  if (tab !== "seance" || !$("#view .sets") || !hasTyped()) return;
  const s = collect();
  if (!Object.values(s.sets).some(a => filled(a).length) && !sessions.some(x => x.day === s.day && x.date === s.date)) return;
  try { autoBusy = store.saveSession(s); await autoBusy; const el = $("#autostate"); if (el) el.textContent = `✓ Sauvegardé à ${new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`; }
  catch (e) { toast("Sauvegarde auto impossible : réessaie"); }
  finally { autoBusy = null; }
}

function suggestFor(d, n = 3) {
  const names = d.ex.map(x => norm(x.name));
  const muscles = [...new Set(d.ex.map(x => x.muscle))];
  const focus = muscles.filter(m => PRIORITY.includes(m)).concat(muscles.filter(m => !PRIORITY.includes(m)));
  return LIBRARY.filter(x => focus.includes(x.m) && !names.includes(norm(x.n)))
    .sort((a, b) => (b.r ? 2 : 0) - (a.r ? 2 : 0) || focus.indexOf(a.m) - focus.indexOf(b.m)).slice(0, n);
}

function seanceStatus(d, existing) {
  if (existing?.done) return `<span class="st done">✓ Terminée</span> Tu peux encore corriger.`;
  if (existing && curDate === today()) return `<span class="st prog">En cours</span> Sauvegarde auto.`;
  if (existing) return `<span class="st prog">Non terminée</span> ${fmtDate(curDate)}`;
  if (curDate !== today()) return `Séance du ${fmtDate(curDate)}`;
  if (d.id !== nextToDo()) return `Pas ta prochaine séance, mais tu peux la faire.`;
  const wd = dayWd(d), tw = new Date().getDay();
  if (wd == null || wd === tw) return `<span class="st todo">À faire aujourd'hui</span>`;
  const lastOcc = addDays(today(), -((tw - wd + 7) % 7));
  const lastDone = sessions.filter(isDone).map(x => x.date).sort().pop() || "";
  if (lastDone && lastOcc > lastDone) return `<span class="st todo">En retard</span> prévue ${d.label.toLowerCase()}`;
  const r = roll(wd);
  return `<span class="st next">Prochaine</span> ${r === 1 ? "demain" : d.label.toLowerCase()}`;
}

/* ---------- records ---------- */
/* meilleure série d'une liste : 1RM estimé, ou reps max pour le poids du corps */
function bestOf(f) {
  f = filled(f); if (!f.length) return null;
  const maxKg = Math.max(...f.map(x => x.kg || 0));
  if (maxKg <= 0) { const r = Math.max(...f.map(x => x.reps || 0)); return { bw: true, score: r, kg: 0, reps: r }; }
  let b = null; f.forEach(x => { const e = e1rm(x.kg || 0, x.reps || 0); if (!b || e > b.score) b = { bw: false, score: e, kg: x.kg, reps: x.reps }; });
  return b && b.score > 0 ? b : null;
}
/* meilleure perf connue sur un exercice (par nom) avant une date */
function bestBefore(name, date) {
  const n = norm(name); let all = [];
  sessions.forEach(s => { if (s.date >= date) return; Object.keys(s.sets || {}).forEach(k => { if (norm(exName(s, k)) === n) all = all.concat(filled(s.sets[k])); }); });
  return bestOf(all);
}
const isPR = (setScore, prev) => prev && setScore && setScore.bw === prev.bw && setScore.score > prev.score + 1e-6;
const volOf = (s) => Object.values(s.sets || {}).flat().reduce((a, x) => a + ((x?.kg || 0) * (x?.reps || 0)), 0);
function sessionStats(s) {
  let nSets = 0; const prs = [];
  Object.entries(s.sets || {}).forEach(([id, a]) => {
    const f = filled(a); if (!f.length) return; nSets += f.length;
    const name = exName(s, id); const cur = bestOf(f), prev = bestBefore(name, s.date);
    if (isPR(cur, prev)) prs.push({ name, ...cur });
  });
  const prevS = sessionsDesc().find(x => x.day === s.day && x.date < s.date && validated(x));
  return { nSets, vol: volOf(s), prs, prevVol: prevS ? volOf(prevS) : null, min: Number(s.duree) || estDuration(s), kcal: kcalFor(s) };
}

/* ---------- échauffement et disques ---------- */
const PLATES = [[25, "--p25", 86], [20, "--p20", 86], [15, "--p15", 78], [10, "--p10", 66], [5, "--p5", 52], [2.5, "--psm", 42], [1.25, "--psm", 36]];
function platesFor(total, bar) {
  if (total == null || total < bar) return { text: `Entre une charge d'au moins ${bar} kg.`, vis: "" };
  let side = (total - bar) / 2; const used = [];
  PLATES.forEach(([w]) => { while (side >= w - 1e-6) { used.push(w); side -= w; } });
  const rest = Math.round(side * 2 * 100) / 100;
  const text = used.length ? `Par côté : ${used.map(w => fmtNum(w, 2)).join(" + ")} kg${rest ? ` (il manque ${fmtNum(rest, 2)} kg)` : ""}` : "Barre seule.";

  [...sessions].filter(validated).sort((a, b) => a.date.localeCompare(b.date)).forEach(s => {

    Object.entries(s.sets || {}).forEach(([id, a]) => { const nm = exName(s, id); if (!nm) return; const k = norm(nm); (per[k] ||= { name: nm, f: [] }).f.push(...filled(a)); });

}

      <div class="scroll"><table><tbody><tr>${ms.slice(-6).reverse().map(m => `<td>${fmtDate(m.date)}<br>${Object.keys(MES).map(k => m[k] != null ? `<span class="s">${fmtNum(m[k])}</span>` : "").join("")}<button class="mini" data-mesdel="${m.date}" aria-label="Supprimer les mesures du ${fmtDate(m.date)}">✕</button></td>`).join("")}</tr></tbody></table></div>`
      : `<p class="sub">Mesure-toi une fois par mois, au même moment : c'est le meilleur signe que les bras et les pecs grossissent.</p>`}
  </section>`;
}
function lineChart(pts, unit) {
  if (!pts.length) return "";
  const W = 360, H = 190, L = 36, R = 10, T = 12, B = 26;
  const ys = pts.map(p => p.y); let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * .12; lo = Math.max(0, lo - pad); hi += pad;
  const t0 = new Date(pts[0].x).getTime(), t1 = new Date(pts.at(-1).x).getTime();
  const X = (x) => pts.length === 1 ? (L + W - R) / 2 : L + (new Date(x).getTime() - t0) / Math.max(1, t1 - t0) * (W - L - R);
  const Y = (y) => T + (1 - (y - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, (lo + hi) / 2, hi];
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area = pts.length > 1 ? `${d}L${X(pts.at(-1).x).toFixed(1)},${H - B}L${X(pts[0].x).toFixed(1)},${H - B}Z` : "";
  const last = pts.at(-1);
  const xl = pts.length > 1 ? [pts[0], pts.at(-1)] : [pts[0]];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique ${esc(unit)}">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmtNum(t, 0)}</text>`).join("")}
    ${xl.map((p, i) => `<text x="${X(p.x)}" y="${H - 8}" text-anchor="${pts.length === 1 ? "middle" : i ? "end" : "start"}" font-size="12" fill="var(--muted)">${fmtDate(p.x)}</text>`).join("")}
    ${area ? `<path d="${area}" fill="var(--accent)" fill-opacity=".1"/>` : ""}
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="var(--accent)"/>`).join("")}
    <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
  </svg>`;
}

/* ================= calories & IMC ================= */
const MET_MUSCU = 5;   // musculation intense (Compendium of Physical Activities)
const weightOn = (date) => { const w = [...weights].filter(x => x.date <= date).sort((a, b) => a.date.localeCompare(b.date)).pop() || [...weights].sort((a, b) => a.date.localeCompare(b.date))[0]; return w ? w.kg : null; };
/* durée estimée : chaque série faite = ~40 s d'effort + le repos prévu, plus 8 min d'échauffement */
function estDuration(s) {
  let sec = 8 * 60;
  Object.entries(s.sets || {}).forEach(([id, a]) => { const n = filled(a).length; const ex = allEx()[id]; const rest = ex ? optimalRest(ex) : 90; sec += n * (40 + rest); });
  return Math.round(sec / 60);
}
function kcalFor(s) {
  const kg = weightOn(s.date); if (!kg) return null;
  const min = Number(s.duree) || estDuration(s);
  return Math.round(MET_MUSCU * kg * min / 60);
}
function imcInfo() {
  const kg = weightOn(today()), h = Number(profil.taille);
  if (!kg || !h) return null;
  const imc = kg / (h / 100) ** 2;
  const cat = imc < 18.5 ? ["Maigreur", "var(--warn)"] : imc < 25 ? ["Corpulence normale", "var(--up)"] : imc < 30 ? ["Surpoids", "var(--warn)"] : ["Obésité", "var(--accent)"];
  return { imc, cat: cat[0], color: cat[1], kg };
}
function besoins() {
  const kg = weightOn(today()), h = Number(profil.taille), a = Number(profil.age);
  if (!kg || !h || !a) return null;
  const bmr = 10 * kg + 6.25 * h - 5 * a + (profil.sexe === "f" ? -161 : 5);   // Mifflin-St Jeor
  const fact = { leger: 1.375, modere: 1.55, eleve: 1.725 }[profil.activite || "modere"];
  const maint = bmr * fact;
  return { bmr: Math.round(bmr), maint: Math.round(maint / 10) * 10, masse: Math.round((maint + 300) / 10) * 10, protMin: Math.round(kg * 1.6), protMax: Math.round(kg * 2) };
}

    ${!weightOn(today()) ? `<p class="sub">Ajoute ton poids (Historique › Corps) pour calculer ton IMC et tes calories.</p>` : ""}
    ${im ? `<div class="imc">
      <div class="top"><span class="label">IMC</span><b class="big" style="color:${im.color}">${fmtNum(im.imc)}</b></div>

    </div>` : ""}
    ${be ? `<div class="kcalgrid">
      <div><span class="label">Métabolisme de base</span><b>${be.bmr} kcal</b></div>

const TARGET = { pecs: 18, dos: 18, epaules: 10, arriere: 6, biceps: 8, triceps: 4 };

}

  let best = null, bestScore = Infinity;
  for (const perm of permutations(keys.map((k, i) => i))) {

    for (let i = 0; i < wds.length; i++) sc += recencyPenalty(keys[perm[i]], wds[i]) * 10;

let calMonth = today().slice(0, 7);

const validated = (s) => Object.values(s.sets || {}).some(a => filled(a).length);
function monthStats(monthKey) {
  const [y, mo] = monthKey.split("-").map(Number);
  const first = new Date(y, mo - 1, 1), nDays = new Date(y, mo, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const curWds = new Set(prog().days.map(dayWd).filter(x => x != null));
  const ph = cfg.planHistory || [];
  const plannedOn = (iso) => { if (iso >= today()) return curWds; const e = [...ph].reverse().find(x => x.from <= iso); return e ? new Set(e.wds) : curWds; };
  const valid = sessions.filter(validated);
  const byDate = {}; valid.forEach(s => (byDate[s.date] ||= []).push(s));
  const startDate = valid.map(s => s.date).sort()[0] || today();
  const td = today();
  let nDone = 0, nMiss = 0, nPlan = 0;
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(`<span class="cday out"></span>`);
  for (let d = 1; d <= nDays; d++) {
    const iso = `${monthKey}-${String(d).padStart(2, "0")}`;
    const wd = new Date(y, mo - 1, d).getDay();
    const planned = plannedOn(iso).has(wd);
    let cls = "", mark = "", label = `${d}`;
    if (byDate[iso]) { cls = "done"; mark = "✓"; nDone++; label += " : séance faite"; }
    else if (planned && iso < td && iso >= startDate) { cls = "miss"; mark = "✕"; nMiss++; label += " : séance manquée"; }
    else if (planned && iso >= td) { cls = "plan"; mark = "•"; nPlan++; label += " : séance prévue"; }
    if (iso === td) cls += " today";
    cells.push(`<button class="cday ${cls}" data-cal="${iso}" aria-label="${label}">${d}<i>${mark}</i></button>`);
  }
  return { cells, nDone, nMiss, nPlan, rate: nDone + nMiss ? Math.round(nDone / (nDone + nMiss) * 100) : null, first, valid };
}

let timerEnd = 0, timerDur = 0, timerInt = null, timerRang = false, audioCtx = null;

  for (const w of data.weights || []) {
    if (!w || !w.date || !(w.kg > 0) || weights.some(x => x.date === w.date)) continue;
    await store.saveWeight({ date: w.date, kg: w.kg }); nw++;
  }
  if (data.profil && Object.keys(data.profil).length && !Object.keys(profil).length) await store.saveProfil(data.profil);
  else if (data.profil?.mesures?.length) {
    const mine = profil.mesures || []; const add = data.profil.mesures.filter(m => m?.date && !mine.some(x => x.date === m.date));
    if (add.length) await store.saveProfil({ ...profil, mesures: mine.concat(add) });
  }
  if (data.cfg?.programs && (data.cfg.savedAt || 0) > (cfg.savedAt || 0)) {
    applyCfg(data.cfg); draft = null; nc = true;
    cfg.savedAt = localSavedAt = Date.now(); lastCfgJson = JSON.stringify(cfg); await store.saveCfg(clone(cfg));
  }
  goToNext();
  return { s: ns, w: nw, c: nc };
}

/* ================= confirmation en deux temps ================= */
function confirmTap(btn, text) {
  if (armed === btn) { armed = null; return true; }
  armed = btn; btn.dataset.orig = btn.textContent; btn.textContent = text;
  setTimeout(() => { if (armed === btn) { armed = null; btn.textContent = btn.dataset.orig; } }, 3500);
  return false;
}

/* ================= événements ================= */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t) return;
  const ds = t.dataset;
  if (ds.tadd) { timerEnd += Number(ds.tadd) * 1000; timerDur = Math.max(timerDur, Math.ceil((timerEnd - Date.now()) / 1000)); timerRang = false; tickTimer(); return; }
  if (ds.tstop) { stopTimer(); return; }
  if (t.id === "open-settings") { openSettings(); return; }
  if (t.id === "st-close") { closeSettings(); return; }
  if (t.id === "bl-close") { closeBilan(); return; }
  if (t.id === "bl-share") { shareSession(bilanSession); return; }

  /* --- choix d'exercice --- */
  if (picker) {
    if (t.id === "pk-close") { closePicker(); return; }
    if (ds.pm != null && t.classList.contains("chip")) { picker.filterM = ds.pm; $$("[data-pm]").forEach(b => b.setAttribute("aria-pressed", b.dataset.pm === ds.pm)); renderPickerList(); return; }
    if (ds.pq != null && t.classList.contains("chip")) { picker.eq = ds.pq; $$("[data-pq]").forEach(b => b.setAttribute("aria-pressed", b.dataset.pq === ds.pq)); renderPickerList(); return; }
    if (ds.scope) { picker.scope = ds.scope; $$("[data-scope]").forEach(b => b.setAttribute("aria-pressed", b.dataset.scope === ds.scope)); const h = $("#pk-scopehint"); if (h) h.textContent = ds.scope === "once" ? "Ton programme ne bouge pas : la semaine prochaine, tu retrouves l'exercice habituel." : "L'exercice est remplacé dans ton programme pour toutes les prochaines séances."; return; }
    if (ds.pick) { const x = LIBRARY[+ds.pick]; const cb = picker.onPick, sc = picker.scope; closePicker(); await cb(x, sc); return; }
    if (t.id === "pk-usecustom") { const n = $("#pk-custom").value.trim(); if (!n) { $("#pk-custom").focus(); return; } const x = libFind(n) || { n, m: picker.muscle || "autre", q: "", c: false }; const cb = picker.onPick, sc = picker.scope; closePicker(); await cb(x, sc); return; }
    return;
  }

  /* tout changement de jour, de date ou d'onglet enregistre d'abord la saisie en cours */
  if (ds.tab || ds.day || ds.cal || ds.open || (ds.date && t.closest("thead"))) await flushAutosave();

  /* --- calendrier --- */
  if (ds.setwd) {
    const [id, w] = ds.setwd.split("|"); const wd = +w;
    const days = prog().days; const day = days.find(x => x.id === id); if (!day || dayWd(day) === wd) return;
    const other = days.find(x => x !== day && dayWd(x) === wd);
    if (other) other.label = day.label;
    day.label = WD_LABELS[wd]; sortDays(days); proposal = null;
    render(); await persistCfg(other ? `${day.title} ⇄ ${other.title}` : `${day.title} → ${WD_LABELS[wd]}`); return;
  }
  if (ds.addday) {
    const wd = +ds.addday; const wds = prog().days.map(dayWd).concat([wd]);
    proposal = { kind: "add", wd, split: planSplit(wds), comp: complementFor(prog().days, wd) };
    render(); $("#proposal")?.scrollIntoView({ behavior: "smooth", block: "center" }); return;
  }
  if (ds.rmday) {
    const days = prog().days; if (days.length <= 1) return;
    if (!confirmTap(t, "Sûr ?")) return;
    const i = days.findIndex(x => x.id === ds.rmday); if (i < 0) return;
    const [rm] = days.splice(i, 1);
    proposal = { kind: "remove", split: planSplit(days.map(dayWd)) };
    render(); await persistCfg(`${rm.title} retirée (historique conservé)`);
    $("#proposal")?.scrollIntoView({ behavior: "smooth", block: "center" }); return;
  }
  if (t.id === "recalc") { proposal = { kind: "recalc", split: planSplit(prog().days.map(dayWd)) }; render(); $("#proposal")?.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  if (t.id === "prop-cancel") { proposal = null; addingDay = false; render(); return; }
  if (t.id === "prop-apply") {
    const p = proposal; proposal = null; addingDay = false;
    cfg.programs[cfg.active].days = buildDays(p.split, prog().days);
    render(); await persistCfg(`Nouvelle répartition sur ${p.split.length} séances`); return;
  }
  if (t.id === "prop-keep") {
    const p = proposal; proposal = null; addingDay = false;
    if (p.kind === "add") {
      const days = prog().days;
      const nd = buildDays([{ wd: p.wd, key: p.comp }], [])[0]; days.push(nd); sortDays(days); progDayId = nd.id;
      render(); await persistCfg(`${TEMPLATES[p.comp].title} ajoutée le ${WD_LABELS[p.wd].toLowerCase()}`);
    } else render();
    return;
  }
  if (ds.hv) { histView = ds.hv; render(); return; }
  if (ds.mesk) { mesK = ds.mesk; render(); return; }
  if (ds.share) { const [day, date] = ds.share.split("|"); shareSession(sessions.find(s => s.day === day && s.date === date)); return; }
  if (ds.pday) { progDayId = ds.pday; addingDay = false; proposal = null; moreOpen = null; render(); return; }
  if (ds.paddtab) { addingDay = true; proposal = null; moreOpen = null; render(); return; }
  if (ds.calnav) { const [y, m] = calMonth.split("-").map(Number); const d = new Date(y, m - 1 + Number(ds.calnav), 1); calMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; render(); return; }
  if (ds.cal) {
    const ss = sessions.filter(s => s.date === ds.cal && validated(s));
    if (ss.length && prog().days.some(x => x.id === ss[0].day)) curDayByProg[cfg.active] = ss[0].day;
    else { const p = prog(); const wd = new Date(ds.cal + "T12:00:00").getDay(); const d = p.days.find(x => dayWd(x) === wd); if (d) curDayByProg[cfg.active] = d.id; }
    manualNav = true; curDate = ds.cal; tab = "seance"; doneSets.clear(); render(); window.scrollTo({ top: 0 }); return;
  }
  if (ds.open) {
    const [day, date] = ds.open.split("|");
    if (!prog().days.some(x => x.id === day)) { openSummary = openSummary === `${day}|${date}` ? null : `${day}|${date}`; render(); return; }
    manualNav = true; curDayByProg[cfg.active] = day; curDate = date; tab = "seance"; render(); window.scrollTo({ top: 0 }); return;
  }

  if (ds.tab) {
    if (ds.tab === "programme" && tab !== "programme") { progDayId = curDayId(); addingDay = false; proposal = null; moreOpen = null; }
    tab = ds.tab; render(); window.scrollTo({ top: 0 }); return;
  }
  if (ds.day) { manualNav = true; curDayByProg[cfg.active] = ds.day; render(); return; }
  if (ds.date && t.closest("thead")) { manualNav = true; curDate = ds.date; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }

  /* --- séance --- */
  if (ds.done) {
    const dd = dayObj(); const list = effEx(dd, curDate); const [exId, i] = ds.done.split("|"); const ex = list.find(x => x.id === exId); if (!ex) return;
    const key = `${curDate}|${dd.id}|${exId}|${i}`;
    const kg = $(`#kg-${exId}-${i}`), rp = $(`#rp-${exId}-${i}`);
    if (t.classList.contains("on")) {   // annule la série
      doneSets.delete(key); kg.value = ""; rp.value = ""; typed[tkey(kg.id)] = ""; typed[tkey(rp.id)] = "";
      t.classList.remove("on", "pr"); t.textContent = "✓"; t.setAttribute("aria-pressed", "false"); scheduleAutosave(); updateKcal(); return;
    }
    if (!kg.value && kg.placeholder && kg.placeholder !== "kg") kg.value = kg.placeholder;
    if (!rp.value && rp.placeholder && rp.placeholder !== "reps") rp.value = rp.placeholder;
    if (!kg.value && !rp.value) { rp.focus(); toast("Note tes reps (et ta charge) puis touche ✓"); return; }
    typed[tkey(kg.id)] = kg.value; typed[tkey(rp.id)] = rp.value; doneSets.add(key);
    t.classList.add("on"); t.setAttribute("aria-pressed", "true"); ensureAudio();
    const sc = bestOf([{ kg: parseNum(kg.value), reps: parseNum(rp.value) }]), prev = bestBefore(ex.name, curDate);
    if (isPR(sc, prev)) {
      t.classList.add("pr"); t.textContent = "🏆";
      const others = bestOf(Array.from({ length: ex.sets }, (_, j) => j === +i ? null : { kg: parseNum($(`#kg-${exId}-${j}`)?.value), reps: parseNum($(`#rp-${exId}-${j}`)?.value) }).filter(Boolean));
      if (!others || others.bw !== sc.bw || sc.score > others.score + 1e-6) toast(`🏆 Nouveau record sur ${ex.name} !`);
    }
    scheduleAutosave(); updateKcal();
    const all = list.every(x => Array.from({ length: x.sets }, (_, j) => $(`[data-done="${x.id}|${j}"]`)?.classList.contains("on")).every(Boolean));
    const already = sessions.find(s => s.day === dd.id && s.date === curDate)?.done;
    if (all && !already) { await finishSession(null); return; }
    startTimer(optimalRest(ex), ex.name);
    return;
  }
  if (ds.tools) { toolsOpen = toolsOpen === ds.tools ? null : ds.tools; render(); return; }
  if (t.id === "edit-day") { await flushAutosave(); progDayId = dayObj()?.id; addingDay = false; proposal = null; moreOpen = null; tab = "programme"; render(); window.scrollTo({ top: 0 }); return; }
  if (t.id === "share-cur") { shareSession(sessions.find(s => s.day === dayObj()?.id && s.date === curDate)); return; }
  if (ds.more) { moreOpen = moreOpen === ds.more ? null : ds.more; render(); return; }
  const d = tab === "programme" ? progDay() : dayObj();
  const findEx = (id) => d.ex.findIndex(x => x.id === id);
  if (ds.swap) {
    const i = findEx(ds.swap); const old = d.ex[i]; if (!old) return;
    const eff = effEx(d, curDate), cur = eff[i];
    openPicker({ title: `Changer ${cur.name}`, muscle: old.muscle, current: cur.name, exclude: eff.map(x => x.name), scope: "once", scopeDate: curDate,
      onPick: async (x, scope) => {
        const sw = { ...swapsFor(d.id, curDate) };
        if (scope === "always") {
          delete sw[old.id]; setSwaps(d.id, curDate, sw);
          return changeDay(d.id, (dd) => { const j = dd.ex.findIndex(e => e.id === old.id); if (j < 0) return false; dd.ex[j] = fromLib(x, dd.ex[j], dd.id); }, `${old.name} → ${x.n} dans le programme`);
        }
        if (norm(x.n) === norm(old.name)) delete sw[old.id];
        else sw[old.id] = { name: x.n, muscle: x.m, reps: libFind(x.n) ? defaultReps(x) : old.reps };
        await applySwaps(d.id, sw, norm(x.n) === norm(old.name) ? `${old.name} remis` : `${x.n} pour cette séance seulement`);
      } });
    return;
  }
  if (ds.unswap) { const sw = { ...swapsFor(d.id, curDate) }; const o = d.ex.find(x => x.id === ds.unswap); delete sw[ds.unswap]; await applySwaps(d.id, sw, `${o?.name || "Exercice"} remis`); return; }
  if (ds.pickreplace) {
    const i = findEx(ds.pickreplace); const old = d.ex[i];
    openPicker({ title: `Remplacer ${old.name}`, muscle: old.muscle, current: old.name, exclude: d.ex.map(x => x.name),
      onPick: (x) => changeDay(d.id, (dd) => { const j = dd.ex.findIndex(e => e.id === old.id); if (j < 0) return false; dd.ex[j] = fromLib(x, dd.ex[j], dd.id); }, `${old.name} → ${x.n}`) });
    return;
  }
  if (ds.setreps) { const [id, r] = ds.setreps.split("|"); await changeDay(d.id, (dd) => { const ex = dd.ex.find(e => e.id === id); if (!ex || ex.reps === r) return false; ex.reps = r; }); return; }
  if (ds.copyto) {
    const [id, to] = ds.copyto.split("|"); const src = d.ex.find(e => e.id === id); const target = prog().days.find(x => x.id === to); if (!src || !target) return;
    await changeDay(to, (dd) => { dd.ex.push({ ...clone(src), id: `${String(to).slice(0, 2)}-${uid()}` }); }, `${src.name} copié vers ${target.label}`); return;
  }
  if (ds.moveto) {
    const [id, to] = ds.moveto.split("|"); await moveExToDay(d.id, id, to); return;
  }
  if (ds.addset || ds.rmset) {
    const id = ds.addset || ds.rmset, inc = ds.addset ? 1 : -1;
    await changeDay(d.id, (dd) => { const ex = dd.ex.find(e => e.id === id); if (!ex) return false; ex.sets = Math.max(1, Math.min(10, ex.sets + inc)); });
    return;
  }
  if (ds.rmex) {
    if (!confirmTap(t, "Sûr ?")) return;
    const i = findEx(ds.rmex); const ex = d.ex[i];
    await changeDay(d.id, (dd) => { const j = dd.ex.findIndex(e => e.id === ex.id); if (j < 0) return false; dd.ex.splice(j, 1); moreOpen = null; }, `${ex.name} retiré`);
    return;
  }
  if (ds.quickadd) { const x = LIBRARY[+ds.quickadd]; await changeDay(d.id, (dd) => { dd.ex.push(fromLib(x, null, dd.id)); }, `${x.n} ajouté`); return; }
  if (t.id === "addex-day") {
    const muscles = d.ex.map(x => x.muscle);
    const focus = PRIORITY.find(m => muscles.includes(m)) || muscles[0] || "pecs";
    openPicker({ title: `Ajouter à ${d.label}`, muscle: focus, exclude: d.ex.map(x => x.name),
      onPick: (x) => changeDay(d.id, (dd) => { dd.ex.push(fromLib(x, null, dd.id)); }, `${x.n} ajouté`) });
    return;
  }
  if (t.id === "save") { await finishSession(t); return; }
  if (t.id === "del") {
    if (!confirmTap(t, "Confirmer la suppression")) return;
    clearTimeout(autoT); if (autoBusy) await autoBusy.catch(() => {});
    const pre = `${curDate}|${d.id}|`; Object.keys(typed).forEach(k => { if (k.startsWith(pre)) delete typed[k]; });
    doneSets.forEach(k => { if (k.startsWith(`${curDate}|${d.id}|`)) doneSets.delete(k); });
    try { await store.deleteSession(d.id, curDate); render(); toast("Séance supprimée"); } catch (err) { toast("Suppression impossible"); }
    return;
  }

  /* --- progrès --- */
  if (t.id === "pf-save") {
    const taille = parseNum($("#pf-taille").value), age = parseNum($("#pf-age").value);
    if (!taille || taille < 120 || taille > 230) { toast("Entre ta taille en cm (ex. 180)"); return; }
    if (age != null && (age < 10 || age > 100)) { toast("Entre un âge valide"); return; }
    try { await store.saveProfil({ ...profil, taille, age, sexe: $("#pf-sexe").value, activite: $("#pf-act").value }); renderSettings(); toast("Profil enregistré"); } catch (err) { toast("Échec de l'enregistrement"); }
    return;
  }
  if (t.id === "wsave") {
    const kg = parseNum($("#wkg").value), date = $("#wdate").value;
    if (!kg || kg < 30 || kg > 250 || !date) { toast("Entre un poids valide"); return; }
    try { await store.saveWeight({ date, kg }); render(); toast("Poids enregistré"); } catch (err) { toast("Échec de l'enregistrement"); }
    return;
  }
  if (t.id === "mes-save") {
    const date = $("#mdate").value; const m = { date }; let any = false;
    for (const k of Object.keys(MES)) { const v = parseNum($(`#m-${k}`).value); if (v == null) continue; if (v < 10 || v > 250) { toast("Entre tes mesures en cm"); return; } m[k] = v; any = true; }
    if (!date || !any) { toast("Entre au moins une mesure"); return; }
    const old = (profil.mesures || []).find(x => x.date === date) || {};
    const mesures = (profil.mesures || []).filter(x => x.date !== date).concat([{ ...old, ...m }]);
    try { await store.saveProfil({ ...profil, mesures }); render(); toast("Mesures enregistrées"); } catch (err) { toast("Échec de l'enregistrement"); }
    return;
  }
  if (ds.mesdel) { if (!confirmTap(t, "?")) return; try { await store.saveProfil({ ...profil, mesures: (profil.mesures || []).filter(x => x.date !== ds.mesdel) }); render(); } catch (err) {} return; }
  if (ds.wdel) { if (!confirmTap(t, "?")) return; try { await store.deleteWeight(ds.wdel); render(); } catch (err) {} return; }

  /* --- sauvegarde --- */
  if (t.id === "exp") { exportData(); return; }
  if (t.id === "imp") {
    const txt = $("#imp-txt").value.trim(); if (!txt) { toast("Choisis un fichier ou colle une sauvegarde"); return; }
    let data; try { data = JSON.parse(txt); } catch (err) { toast("Texte illisible : ce n'est pas une sauvegarde"); return; }
    if (!Array.isArray(data?.sessions)) { toast("Ce fichier n'est pas une sauvegarde du carnet"); return; }
    if (!confirmTap(t, `Importer ${data.sessions.length} séance${data.sessions.length > 1 ? "s" : ""} ? Appuie encore`)) return;
    t.disabled = true;
    try { const r = await importData(data); render(); toast(`Import terminé : ${r.s} séance${r.s > 1 ? "s" : ""}, ${r.w} pesée${r.w > 1 ? "s" : ""}${r.c ? ", programme" : ""}`); }
    catch (err) { t.disabled = false; toast("Échec de l'import, réessaie"); }
    return;
  }
});

document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if (picker) closePicker(); else if (!$("#bilan").hidden) closeBilan(); else if (settingsOpen) closeSettings(); });
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.id === "imp-file" && t.files?.[0]) { try { $("#imp-txt").value = await t.files[0].text(); toast("Fichier chargé : appuie sur Importer"); } catch (err) { toast("Lecture du fichier impossible"); } return; }
  if (t.id === "day-title") { const v = t.value.trim(); if (v) await changeDay(editDayId(), (dd) => { if (dd.title === v) return false; dd.title = v; }, "Séance renommée"); return; }
  if (t.id === "prop-comp" && proposal) { proposal.comp = t.value; return; }
  if (t.dataset.propkey != null && proposal) { proposal.split[+t.dataset.propkey].key = t.value; render(); $("#proposal")?.scrollIntoView({ block: "center" }); return; }
  if (t.id === "date" && t.value) { await flushAutosave(); manualNav = true; curDate = t.value; render(); return; }
  if (t.id === "progsel") { progEx = t.value; render(); return; }
  if (t.id === "pl-bar") { calcTools(); return; }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.closest(".sets") || t.id === "note" || t.id === "duree") { typed[tkey(t.id)] = t.value; scheduleAutosave(); if (t.id !== "note") updateKcal(); }
  if (["pl-total", "rm-kg", "rm-reps", "wu-kg"].includes(t.id)) calcTools();
  if (t.id === "pk-q") { picker.q = t.value; if (t.value.trim() && picker.filterM) { picker.filterM = ""; $$("[data-pm]").forEach(b => b.setAttribute("aria-pressed", b.dataset.pm === "")); } renderPickerList(); }
});

/* en revenant dans l'app après 20 min ou un changement de jour, on réaffiche la séance à faire */
let hiddenAt = 0;
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) { hiddenAt = Date.now(); await flushAutosave(); return; }
  checkUpdate();
  const dayChanged = curDate !== today() && !manualNav;
  if (dayChanged || (hiddenAt && Date.now() - hiddenAt > 20 * 60 * 1000)) {
    if (picker || drag || tab === "programme") return;
    goToNext(); if (tab === "seance") render();
  }
});

/* ================= mise à jour automatique (version GitHub / écran d'accueil) ================= */
const APP_VERSION = "2026-11-22.3";
let updChecking = false;
async function checkUpdate() {
  if (!/github\.io$/.test(location.hostname) || updChecking) return;
  updChecking = true;
  try {
    const r = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    const m = (await r.text()).match(/const APP_VERSION = "([^"]+)"/);
    if (!m || m[1] === APP_VERSION) return;
    const go = async () => { await flushAutosave(); location.replace(location.pathname + "?v=" + encodeURIComponent(m[1])); };
    if (!hasTyped() && !picker && !drag && !settingsOpen) { go(); return; }   // rien en cours : on recharge tout de suite
    let b = $("#upd");
    if (!b) { b = document.createElement("button"); b.id = "upd"; b.className = "toast"; b.style.border = "0"; b.textContent = "Nouvelle version · touche pour mettre à jour"; document.body.appendChild(b); b.onclick = go; }
  } catch (e) {} finally { updChecking = false; }
}

/* ================= démarrage ================= */
render();
store.init();
checkUpdate();
</script>
