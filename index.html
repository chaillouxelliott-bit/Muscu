      db.doc("config/profil").onSnapshot((snap) => { if (snap.exists) { profil = snap.data() || {}; refresh("weights"); } }, () => {});
      db.collection("poids").orderBy("date", "asc").limit(1000).onSnapshot(
        (snap) => { weights = snap.docs.map(d => d.data()); refresh("weights"); }, () => {});
      db.doc("config/programme").onSnapshot((snap) => { if (snap.exists && cfgFromStore(snap.data())) refresh("cfg"); }, () => {});
    } else {
      setStatus("Données enregistrées sur cet appareil. Pense à les exporter de temps en temps (Outils).");
      try { sessions = JSON.parse(localStorage.getItem("carnet-seances") || "[]"); } catch (e) {}
      try { weights = JSON.parse(localStorage.getItem("carnet-poids") || "[]"); } catch (e) {}
      try { profil = JSON.parse(localStorage.getItem("carnet-profil") || "{}") || {}; } catch (e) {}

  /* la liste locale est mise à jour tout de suite : l'écran reflète l'action sans attendre le serveur */
  async saveSession(s) {

  async deleteSession(day, date) {

    if (this.mode === "db") return this.db.collection("seances").doc(`${day}_${date}`).delete();
    this._ls("carnet-seances", sessions);
  },
  async saveWeight(w) {
    if (this.mode === "db") weights = weights.filter(x => x.date !== w.date).concat([w]).sort((a, b) => a.date.localeCompare(b.date));
    if (this.mode === "db") return this.db.collection("poids").doc(w.date).set(w);
    weights = weights.filter(x => x.date !== w.date).concat([w]).sort((a, b) => a.date.localeCompare(b.date));
    this._ls("carnet-poids", weights);

  async deleteWeight(date) {
    if (this.mode === "db") weights = weights.filter(x => x.date !== date);
    if (this.mode === "db") return this.db.collection("poids").doc(date).delete();
    weights = weights.filter(x => x.date !== date); this._ls("carnet-poids", weights);
  },
  async saveProfil(p) {
    profil = p;
    if (this.mode === "db") return this.db.doc("config/profil").set(p);
    this._ls("carnet-profil", p);
  },
  async saveCfg(c) {

    this._ls("carnet-prog", c);
  }

let lastCfgJson = "", localSavedAt = 0;
function cfgFromStore(c) {
  const j = JSON.stringify(c);
  if (j === lastCfgJson) return false;                 // rien de nouveau
  if ((c.savedAt || 0) < localSavedAt) return false;   // plus ancien que notre dernière modif
  lastCfgJson = j; applyCfg(c); return true;
}
function applyCfg(c) {
  _allEx = null;
  if (c.programs) { cfg = { ...clone(c), active: c.active || "B", savedAt: c.savedAt || 0, programs: { ...clone(DEFAULT_CFG.programs), ...clone(c.programs) } }; }
  else if (c.days) { cfg = clone(DEFAULT_CFG); cfg.programs.B.days = c.days; } // ancienne version du carnet
}
let cfgWriting = false, cfgPending = false;
/* garde la trace des jours prévus pour que le calendrier passé ne change pas quand tu modifies tes jours */
function updatePlanHistory() {
  const wds = prog().days.map(dayWd).filter(x => x != null).sort();
  const ph = cfg.planHistory ||= [];
  const last = ph[ph.length - 1];
  if (last && last.wds.join() === wds.join()) return;
  if (last && last.from === today()) last.wds = wds;
  else ph.push({ from: ph.length ? today() : "0000-01-01", wds });
}
async function persistCfg(msg) {
  updatePlanHistory(); _allEx = null;
  cfg.savedAt = localSavedAt = Date.now();
  lastCfgJson = JSON.stringify(cfg);
  if (msg) toast(msg);
  if (cfgWriting) { cfgPending = true; return; }   // une écriture à la fois : la suivante part avec l'état le plus récent
  cfgWriting = true;
  try {
    do { cfgPending = false; const data = clone(cfg); lastCfgJson = JSON.stringify(data); await store.saveCfg(data); } while (cfgPending);
  } catch (e) { toast("Échec de l'enregistrement du programme : réessaie"); }
  finally { cfgWriting = false; }
}

  const concerns = { sessions: ["seance", "progres", "calendrier"], weights: ["progres"], cfg: ["seance", "progres", "calendrier", "programme"], all: ["seance", "progres", "calendrier", "programme", "outils"] }[reason] || [];
  if (!concerns.includes(tab)) return;
  if (tab === "programme" && draft && reason !== "all") return;
  if (tab === "seance" && reason !== "all") {

function suggestFor(d, n = 3) {
  const names = d.ex.map(x => norm(x.name));
  const muscles = [...new Set(d.ex.map(x => x.muscle))];
  const focus = muscles.filter(m => PRIORITY.includes(m)).concat(muscles.filter(m => !PRIORITY.includes(m)));
  return LIBRARY.filter(x => focus.includes(x.m) && !names.includes(norm(x.n)))

}

/* calories de la séance affichée, à partir de ce qui est saisi */
function kcalLive() {

  if (!kg) return "🔥 Ajoute ton poids (Progrès) pour estimer les calories";

  return `🔥 ≈ <b>${Math.round(MET_MUSCU * kg * min / 60)} kcal</b> brûlées<br><small>${min} min${s.duree ? "" : " estimées"} · ${fmtNum(kg)} kg</small>`;

function updateKcal() { const el = $("#kcalout"); if (el) el.innerHTML = kcalLive(); const du = $("#duree"); if (du && !du.value) du.placeholder = "≈ " + estDuration(collect()); }
function collect() {
  const d = dayObj();

  const sets = clone(prev?.sets || {}), names = clone(prev?.names || {}), muscles = clone(prev?.muscles || {});

    sets[ex.id] = Array.from({ length: ex.sets }, (_, i) => ({ kg: parseNum($(`#kg-${ex.id}-${i}`)?.value), reps: parseNum($(`#rp-${ex.id}-${i}`)?.value) }));
  });

}

/* ---------- Progrès ---------- */
function viewProgres() {
  const thisMon = mondayOf(today());
  const weekS = sessions.filter(s => s.date >= thisMon && s.date <= addDays(thisMon, 6));
  const monthKey = today().slice(0, 7);
  const monthCount = sessions.filter(s => s.date.startsWith(monthKey)).length;
  let streak = 0;
  for (let w = 0; w < 104; w++) { const m = addDays(thisMon, -7 * w); const has = sessions.some(s => s.date >= m && s.date <= addDays(m, 6)); if (has) streak++; else if (w > 0) break; }
  const target = prog().days.length;

  // volume par muscle cette semaine vs prévu
  const planned = {}; prog().days.forEach(d => d.ex.forEach(x => planned[x.muscle] = (planned[x.muscle] || 0) + Number(x.sets)));
  const doneM = {};
  weekS.forEach(s => Object.entries(s.sets || {}).forEach(([id, arr]) => { const m = exMuscle(s, id) || "autre"; doneM[m] = (doneM[m] || 0) + filled(arr).filter(x => x.reps != null).length; }));
  const keys = Object.keys(MUSCLES).filter(k => planned[k] || doneM[k]);

  // exercices avec données
  const exMap = {};
  sessions.forEach(s => Object.entries(s.sets || {}).forEach(([id, arr]) => {
    const nm = exName(s, id); if (!nm || !filled(arr).length) return;
    const k = norm(nm); (exMap[k] ||= { name: nm, pts: [] });
    const best = Math.max(...filled(arr).map(x => e1rm(x.kg || 0, x.reps || 0)));
    const maxKg = Math.max(...filled(arr).map(x => x.kg || 0));
    const vol = filled(arr).reduce((a, x) => a + (x.kg || 0) * (x.reps || 0), 0);
    exMap[k].pts.push({ date: s.date, e: best, kg: maxKg, vol, reps: Math.max(...filled(arr).map(x => x.reps || 0)) });
  }));
  Object.values(exMap).forEach(o => o.pts.sort((a, b) => a.date.localeCompare(b.date)));
  const exKeys = Object.keys(exMap).sort((a, b) => exMap[a].name.localeCompare(exMap[b].name));
  if (!progEx || !exMap[progEx]) progEx = exKeys.find(k => k.includes("incline")) || exKeys[0] || null;
  const sel = progEx ? exMap[progEx] : null;
  const bw = sel && Math.max(...sel.pts.map(p => p.e)) === 0;   // tractions, pompes… sans charge : on suit les reps

function lineChart(pts, unit) {
  if (!pts.length) return "";
  const W = 360, H = 190, L = 36, R = 10, T = 12, B = 26;
  const ys = pts.map(p => p.y); let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * .12; lo = Math.max(0, lo - pad); hi += pad;
  const t0 = new Date(pts[0].x).getTime(), t1 = new Date(pts.at(-1).x).getTime();
  const X = (x) => pts.length === 1 ? (L + W - R) / 2 : L + (new Date(x).getTime() - t0) / Math.max(1, t1 - t0) * (W - L - R);
  const Y = (y) => T + (1 - (y - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, (lo + hi) / 2, hi];
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area = pts.length > 1 ? `${d}L${X(pts.at(-1).x).toFixed(1)},${H - B}L${X(pts[0].x).toFixed(1)},${H - B}Z` : "";
  const last = pts.at(-1);
  const xl = pts.length > 1 ? [pts[0], pts.at(-1)] : [pts[0]];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique ${esc(unit)}">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmtNum(t, 0)}</text>`).join("")}
    ${xl.map((p, i) => `<text x="${X(p.x)}" y="${H - 8}" text-anchor="${pts.length === 1 ? "middle" : i ? "end" : "start"}" font-size="12" fill="var(--muted)">${fmtDate(p.x)}</text>`).join("")}
    ${area ? `<path d="${area}" fill="var(--accent)" fill-opacity=".1"/>` : ""}
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="var(--accent)"/>`).join("")}
    <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
  </svg>`;
}

/* ================= calories & IMC ================= */
const MET_MUSCU = 5;   // musculation intense (Compendium of Physical Activities)
const weightOn = (date) => { const w = [...weights].filter(x => x.date <= date).sort((a, b) => a.date.localeCompare(b.date)).pop() || [...weights].sort((a, b) => a.date.localeCompare(b.date))[0]; return w ? w.kg : null; };
/* durée estimée : chaque série faite = ~40 s d'effort + le repos prévu, plus 8 min d'échauffement */
function estDuration(s) {
  let sec = 8 * 60;
  Object.entries(s.sets || {}).forEach(([id, a]) => { const n = filled(a).length; const ex = allEx()[id]; const rest = ex ? optimalRest(ex) : 90; sec += n * (40 + rest); });
  return Math.round(sec / 60);
}
function kcalFor(s) {
  const kg = weightOn(s.date); if (!kg) return null;
  const min = Number(s.duree) || estDuration(s);
  return Math.round(MET_MUSCU * kg * min / 60);
}
function imcInfo() {
  const kg = weightOn(today()), h = Number(profil.taille);
  if (!kg || !h) return null;
  const imc = kg / (h / 100) ** 2;
  const cat = imc < 18.5 ? ["Maigreur", "var(--warn)"] : imc < 25 ? ["Corpulence normale", "var(--up)"] : imc < 30 ? ["Surpoids", "var(--warn)"] : ["Obésité", "var(--accent)"];
  return { imc, cat: cat[0], color: cat[1], kg };
}
function besoins() {
  const kg = weightOn(today()), h = Number(profil.taille), a = Number(profil.age);
  if (!kg || !h || !a) return null;
  const bmr = 10 * kg + 6.25 * h - 5 * a + (profil.sexe === "f" ? -161 : 5);   // Mifflin-St Jeor
  const fact = { leger: 1.375, modere: 1.55, eleve: 1.725 }[profil.activite || "modere"];
  const maint = bmr * fact;
  return { bmr: Math.round(bmr), maint: Math.round(maint / 10) * 10, masse: Math.round((maint + 300) / 10) * 10, protMin: Math.round(kg * 1.6), protMax: Math.round(kg * 2) };
}

  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const { from, to, day, rows } = drag; const exId = drag.row.dataset.ex;
  rows.forEach(r => { r.style.transform = ""; r.classList.remove("dragging"); });
  $$(".tab.droptarget").forEach(t => t.classList.remove("droptarget"));
  drag = null;
  const dId = curDayId();
  if (day) { await moveExToDay(dId, exId, day); return; }
  if (to !== from && to >= 0) await changeDay(dId, (dd) => { const i = dd.ex.findIndex(x => x.id === exId); if (i < 0) return false; const [ex] = dd.ex.splice(i, 1); dd.ex.splice(Math.min(to, dd.ex.length), 0, ex); });
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

/* ================= export / import ================= */
async function exportData() {
  const data = { app: "carnet-muscu", version: 1, exportedAt: new Date().toISOString(), sessions, weights, profil, cfg };
  const json = JSON.stringify(data);
  const out = $("#exp-out"); if (out) { out.value = json; out.hidden = false; $("#exp-hint").hidden = false; }
  const filename = `carnet-muscu-${today()}.json`;
  /* dans Claude : téléchargement via la plateforme ; ailleurs (GitHub) : lien classique */
  let dl = null; try { dl = window.claude?.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: json }); toast("Sauvegarde téléchargée"); }
    catch (e) { toast(e?.code === "declined" ? "Téléchargement annulé : le texte reste copiable" : "Copie le texte affiché pour garder ta sauvegarde"); }
    return;
  }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch (e) {}
  try { navigator.clipboard?.writeText(json).then(() => toast("Sauvegarde exportée et copiée"), () => toast("Sauvegarde exportée")); } catch (e) { toast("Sauvegarde exportée"); }
}
async function importData(data) {
  let ns = 0, nw = 0, nc = false;
  for (const s of data.sessions) {
    if (!s || !s.day || !s.date) continue;
    const mine = sessions.find(x => x.day === s.day && x.date === s.date);
    if (mine && String(mine.updatedAt || "") >= String(s.updatedAt || "")) continue;
    await store.saveSession(s); ns++;
  }
  for (const w of data.weights || []) {
    if (!w || !w.date || !(w.kg > 0) || weights.some(x => x.date === w.date)) continue;
    await store.saveWeight({ date: w.date, kg: w.kg }); nw++;
  }
  if (data.profil && Object.keys(data.profil).length && !Object.keys(profil).length) await store.saveProfil(data.profil);
  if (data.cfg?.programs && (data.cfg.savedAt || 0) > (cfg.savedAt || 0)) {
    applyCfg(data.cfg); draft = null; nc = true;
    cfg.savedAt = localSavedAt = Date.now(); lastCfgJson = JSON.stringify(cfg); await store.saveCfg(clone(cfg));
  }
  goToNext();
  return { s: ns, w: nw, c: nc };
}

/* ================= confirmation en deux temps ================= */
function confirmTap(btn, text) {
  if (armed === btn) { armed = null; return true; }
  armed = btn; btn.dataset.orig = btn.textContent; btn.textContent = text;
  setTimeout(() => { if (armed === btn) { armed = null; btn.textContent = btn.dataset.orig; } }, 3500);
  return false;
}

/* ================= événements ================= */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t) return;
  const ds = t.dataset;

  /* --- choix d'exercice --- */
  if (picker) {
    if (t.id === "pk-close") { closePicker(); return; }
    if (ds.pm != null && t.classList.contains("chip")) { picker.filterM = ds.pm; $$("[data-pm]").forEach(b => b.setAttribute("aria-pressed", b.dataset.pm === ds.pm)); renderPickerList(); return; }
    if (ds.pq != null && t.classList.contains("chip")) { picker.eq = ds.pq; $$("[data-pq]").forEach(b => b.setAttribute("aria-pressed", b.dataset.pq === ds.pq)); renderPickerList(); return; }
    if (ds.pick) { const x = LIBRARY[+ds.pick]; const cb = picker.onPick; closePicker(); await cb(x); return; }
    if (t.id === "pk-usecustom") { const n = $("#pk-custom").value.trim(); if (!n) { $("#pk-custom").focus(); return; } const x = libFind(n) || { n, m: picker.muscle || "autre", q: "", c: false }; const cb = picker.onPick; closePicker(); await cb(x); return; }
    return;
  }

  /* tout changement de jour, de date ou d'onglet enregistre d'abord la saisie en cours */
  if (ds.tab || ds.day || ds.cal || ds.open || (ds.date && t.closest("thead"))) await flushAutosave();

  /* --- calendrier --- */
  if (ds.setwd) {
    const [id, w] = ds.setwd.split("|"); const wd = +w;
    const days = prog().days; const day = days.find(x => x.id === id); if (!day || dayWd(day) === wd) return;
    const other = days.find(x => x !== day && dayWd(x) === wd);
    if (other) other.label = day.label;
    day.label = WD_LABELS[wd]; sortDays(days); proposal = null;
    render(); await persistCfg(other ? `${day.title} ⇄ ${other.title}` : `${day.title} → ${WD_LABELS[wd]}`); return;
  }
  if (ds.addday) {
    const wd = +ds.addday; const wds = prog().days.map(dayWd).concat([wd]);
    proposal = { kind: "add", wd, split: planSplit(wds), comp: complementFor(prog().days, wd) };
    render(); $("#proposal")?.scrollIntoView({ behavior: "smooth", block: "center" }); return;
  }
  if (ds.rmday) {
    const days = prog().days; if (days.length <= 1) return;
    if (!confirmTap(t, "Sûr ?")) return;
    const i = days.findIndex(x => x.id === ds.rmday); if (i < 0) return;
    const [rm] = days.splice(i, 1);
    proposal = { kind: "remove", split: planSplit(days.map(dayWd)) };
    render(); await persistCfg(`${rm.title} retirée (historique conservé)`);
    $("#proposal")?.scrollIntoView({ behavior: "smooth", block: "center" }); return;
  }
  if (t.id === "recalc") { proposal = { kind: "recalc", split: planSplit(prog().days.map(dayWd)) }; render(); $("#proposal")?.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  if (t.id === "prop-cancel") { proposal = null; render(); return; }
  if (t.id === "prop-apply") {
    const p = proposal; proposal = null;
    cfg.programs[cfg.active].days = buildDays(p.split, prog().days);
    render(); await persistCfg(`Nouvelle répartition sur ${p.split.length} séances`); return;
  }
  if (t.id === "prop-keep") {
    const p = proposal; proposal = null;
    if (p.kind === "add") {
      const days = prog().days;
      days.push(buildDays([{ wd: p.wd, key: p.comp }], [])[0]); sortDays(days);
      render(); await persistCfg(`${TEMPLATES[p.comp].title} ajoutée le ${WD_LABELS[p.wd].toLowerCase()}`);
    } else render();
    return;
  }
  if (ds.calnav) { const [y, m] = calMonth.split("-").map(Number); const d = new Date(y, m - 1 + Number(ds.calnav), 1); calMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; render(); return; }
  if (ds.cal) {
    const ss = sessions.filter(s => s.date === ds.cal && validated(s));
    if (ss.length && prog().days.some(x => x.id === ss[0].day)) curDayByProg[cfg.active] = ss[0].day;
    else { const p = prog(); const wd = new Date(ds.cal + "T12:00:00").getDay(); const d = p.days.find(x => dayWd(x) === wd); if (d) curDayByProg[cfg.active] = d.id; }
    manualNav = true; curDate = ds.cal; tab = "seance"; doneSets.clear(); render(); window.scrollTo({ top: 0 }); return;
  }
  if (ds.open) {
    const [day, date] = ds.open.split("|");
    if (!prog().days.some(x => x.id === day)) { openSummary = openSummary === `${day}|${date}` ? null : `${day}|${date}`; render(); return; }
    manualNav = true; curDayByProg[cfg.active] = day; curDate = date; tab = "seance"; render(); window.scrollTo({ top: 0 }); return;
  }

  if (ds.tab) {
    if (tab === "programme" && ds.tab !== "programme") { if (draftDirty()) await saveDraft("Programme sauvegardé automatiquement"); draft = null; }
    tab = ds.tab; composingFlag = false; render(); window.scrollTo({ top: 0 }); return;
  }
  if (ds.day) { manualNav = true; curDayByProg[cfg.active] = ds.day; render(); return; }
  if (ds.date && t.closest("thead")) { manualNav = true; curDate = ds.date; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }

  /* --- séance --- */
  if (ds.done) {
    const [exId, i] = ds.done.split("|"); const ex = dayObj().ex.find(x => x.id === exId); if (!ex) return;
    const key = `${curDate}|${dayObj().id}|${exId}|${i}`;
    if (doneSets.has(key)) { doneSets.delete(key); t.classList.remove("on"); return; }
    const kg = $(`#kg-${exId}-${i}`), rp = $(`#rp-${exId}-${i}`);
    if (!kg.value && kg.placeholder && kg.placeholder !== "kg") kg.value = kg.placeholder;
    if (!rp.value && rp.placeholder && rp.placeholder !== "reps") rp.value = rp.placeholder;
    typed[tkey(kg.id)] = kg.value; typed[tkey(rp.id)] = rp.value; doneSets.add(key); t.classList.add("on"); scheduleAutosave(); updateKcal();
    return;
  }
  if (t.id === "compose-open") { await flushAutosave(); composingFlag = true; moreOpen = null; render(); return; }
  if (t.id === "compose-done") { composingFlag = false; moreOpen = null; render(); return; }
  if (ds.more) { moreOpen = moreOpen === ds.more ? null : ds.more; render(); return; }
  const d = dayObj();
  const findEx = (id) => d.ex.findIndex(x => x.id === id);
  if (ds.pickreplace) {
    const i = findEx(ds.pickreplace); const old = d.ex[i];
    openPicker({ title: `Remplacer ${old.name}`, muscle: old.muscle, current: old.name, exclude: d.ex.map(x => x.name),
      onPick: (x) => changeDay(d.id, (dd) => { const j = dd.ex.findIndex(e => e.id === old.id); if (j < 0) return false; dd.ex[j] = fromLib(x, dd.ex[j], dd.id); }, `${old.name} → ${x.n}`) });
    return;
  }
  if (ds.setreps) { const [id, r] = ds.setreps.split("|"); await changeDay(d.id, (dd) => { const ex = dd.ex.find(e => e.id === id); if (!ex || ex.reps === r) return false; ex.reps = r; }); return; }
  if (ds.copyto) {
    const [id, to] = ds.copyto.split("|"); const src = d.ex.find(e => e.id === id); const target = prog().days.find(x => x.id === to); if (!src || !target) return;
    await changeDay(to, (dd) => { dd.ex.push({ ...clone(src), id: `${String(to).slice(0, 2)}-${uid()}` }); }, `${src.name} copié vers ${target.label}`); return;
  }
  if (ds.moveto) {
    const [id, to] = ds.moveto.split("|"); await moveExToDay(d.id, id, to); return;
  }
  if (ds.addset || ds.rmset) {
    const id = ds.addset || ds.rmset, inc = ds.addset ? 1 : -1;
    await changeDay(d.id, (dd) => { const ex = dd.ex.find(e => e.id === id); if (!ex) return false; ex.sets = Math.max(1, Math.min(10, ex.sets + inc)); });
    return;
  }
  if (ds.rmex) {
    if (!confirmTap(t, "Sûr ?")) return;
    const i = findEx(ds.rmex); const ex = d.ex[i];
    await changeDay(d.id, (dd) => { const j = dd.ex.findIndex(e => e.id === ex.id); if (j < 0) return false; dd.ex.splice(j, 1); moreOpen = null; }, `${ex.name} retiré`);
    return;
  }
  if (ds.quickadd) { const x = LIBRARY[+ds.quickadd]; await changeDay(d.id, (dd) => { dd.ex.push(fromLib(x, null, dd.id)); }, `${x.n} ajouté`); return; }
  if (t.id === "addex-day") {
    const muscles = d.ex.map(x => x.muscle);
    const focus = PRIORITY.find(m => muscles.includes(m)) || muscles[0] || "pecs";
    openPicker({ title: `Ajouter à ${d.label}`, muscle: focus, exclude: d.ex.map(x => x.name),
      onPick: (x) => changeDay(d.id, (dd) => { dd.ex.push(fromLib(x, null, dd.id)); }, `${x.n} ajouté`) });
    return;
  }
  if (t.id === "save") {
    const s = collect();
    const any = Object.values(s.sets).some(a => a.some(x => x.kg != null || x.reps != null));
    if (!any) { toast("Remplis au moins une série"); return; }
    t.disabled = true;
    clearTimeout(autoT);
    const finishing = !s.done;
    s.done = true;
    try {
      await store.saveSession(s);
      if (finishing) {
        const doneTitle = dayObj().title;
        goToNext(); doneSets.clear(); render(); window.scrollTo({ top: 0, behavior: "smooth" });
        const nx = dayObj();
        toast(`Séance terminée 💪 Prochaine : ${nx.title}`);
      } else { render(); toast("Séance mise à jour"); }
    }
    catch (err) { t.disabled = false; toast(err?.code === "quota_exceeded" ? "Stockage plein : supprime d'anciennes séances" : "Échec de l'enregistrement, réessaie"); }
    return;
  }
  if (t.id === "del") {
    if (!confirmTap(t, "Confirmer la suppression")) return;
    clearTimeout(autoT); if (autoBusy) await autoBusy.catch(() => {});
    const pre = `${curDate}|${d.id}|`; Object.keys(typed).forEach(k => { if (k.startsWith(pre)) delete typed[k]; });
    doneSets.forEach(k => { if (k.startsWith(`${curDate}|${d.id}|`)) doneSets.delete(k); });
    try { await store.deleteSession(d.id, curDate); render(); toast("Séance supprimée"); } catch (err) { toast("Suppression impossible"); }
    return;
  }

  /* --- progrès --- */
  if (t.id === "pf-save") {
    const taille = parseNum($("#pf-taille").value), age = parseNum($("#pf-age").value);
    if (!taille || taille < 120 || taille > 230) { toast("Entre ta taille en cm (ex. 180)"); return; }
    if (age != null && (age < 10 || age > 100)) { toast("Entre un âge valide"); return; }
    try { await store.saveProfil({ taille, age, sexe: $("#pf-sexe").value, activite: $("#pf-act").value }); render(); toast("Profil enregistré"); } catch (err) { toast("Échec de l'enregistrement"); }
    return;
  }
  if (t.id === "wsave") {
    const kg = parseNum($("#wkg").value), date = $("#wdate").value;
    if (!kg || kg < 30 || kg > 250 || !date) { toast("Entre un poids valide"); return; }
    try { await store.saveWeight({ date, kg }); render(); toast("Poids enregistré"); } catch (err) { toast("Échec de l'enregistrement"); }
    return;
  }
  if (ds.wdel) { if (!confirmTap(t, "?")) return; try { await store.deleteWeight(ds.wdel); render(); } catch (err) {} return; }

  /* --- programme --- */
  if (ds.pact) {
    syncDraft(); const day = draft.days[+ds.di], i = +ds.i;
    if (ds.pact === "rm") day.ex.splice(i, 1);
    if (ds.pact === "up" && i > 0) [day.ex[i - 1], day.ex[i]] = [day.ex[i], day.ex[i - 1]];
    if (ds.pact === "down" && i < day.ex.length - 1) [day.ex[i + 1], day.ex[i]] = [day.ex[i], day.ex[i + 1]];
    render(); return;
  }
  if (ds.padd) {
    syncDraft(); const day = draft.days[+ds.padd];
    const muscles = day.ex.map(x => x.muscle);
    openPicker({ title: `Ajouter à ${day.label}`, muscle: PRIORITY.find(m => muscles.includes(m)) || "pecs", exclude: day.ex.map(x => x.name),
      onPick: (x) => { day.ex.push(fromLib(x, null, day.id)); render(); toast(`${x.n} ajouté`); } });
    return;
  }
  if (ds.pname) {
    syncDraft(); const [di, i] = ds.pname.split("|").map(Number); const day = draft.days[di]; const old = day.ex[i];
    openPicker({ title: `Remplacer ${old.name}`, muscle: old.muscle, current: old.name, exclude: day.ex.map(x => x.name),
      onPick: (x) => { day.ex[i] = fromLib(x, old, day.id); render(); toast(`${old.name} → ${x.n}`); } });
    return;
  }
  if (t.id === "psave") { await saveDraft("Programme sauvegardé : tes séances sont à jour"); render(); return; }
  if (t.id === "pcancel") { if (!draftDirty()) { toast("Rien à annuler"); return; } draft = null; render(); toast("Modifications annulées"); return; }
  if (t.id === "preset") {
    if (!confirmTap(t, "Appuie encore : ça remplace tes exercices")) return;
    syncDraft();
    draft.days = buildDays(planSplit(draft.days.map(dayWd)), draft.days);
    render(); toast("Répartition conseillée chargée : sauvegarde pour l'appliquer"); return;
  }

  /* --- sauvegarde --- */
  if (t.id === "exp") { exportData(); return; }
  if (t.id === "imp") {
    const txt = $("#imp-txt").value.trim(); if (!txt) { toast("Choisis un fichier ou colle une sauvegarde"); return; }
    let data; try { data = JSON.parse(txt); } catch (err) { toast("Texte illisible : ce n'est pas une sauvegarde"); return; }
    if (!Array.isArray(data?.sessions)) { toast("Ce fichier n'est pas une sauvegarde du carnet"); return; }
    if (!confirmTap(t, `Importer ${data.sessions.length} séance${data.sessions.length > 1 ? "s" : ""} ? Appuie encore`)) return;
    t.disabled = true;
    try { const r = await importData(data); render(); toast(`Import terminé : ${r.s} séance${r.s > 1 ? "s" : ""}, ${r.w} pesée${r.w > 1 ? "s" : ""}${r.c ? ", programme" : ""}`); }
    catch (err) { t.disabled = false; toast("Échec de l'import, réessaie"); }
    return;
  }
});

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && picker) closePicker(); });
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.id === "imp-file" && t.files?.[0]) { try { $("#imp-txt").value = await t.files[0].text(); toast("Fichier chargé : appuie sur Importer"); } catch (err) { toast("Lecture du fichier impossible"); } return; }
  if (t.id === "day-title") { const v = t.value.trim(); if (v) await changeDay(dayObj().id, (dd) => { if (dd.title === v) return false; dd.title = v; }, "Séance renommée"); return; }
  if (t.id === "prop-comp" && proposal) { proposal.comp = t.value; return; }
  if (t.dataset.propkey != null && proposal) { proposal.split[+t.dataset.propkey].key = t.value; render(); $("#proposal")?.scrollIntoView({ block: "center" }); return; }
  if (tab === "programme") setTimeout(updateSaveBar, 0);
  if (t.id === "date" && t.value) { await flushAutosave(); manualNav = true; curDate = t.value; render(); return; }
  if (t.id === "progsel") { progEx = t.value; render(); return; }
  if (t.id === "pl-bar") { calcTools(); return; }
  if (t.dataset.swapday) {
    const a = +t.dataset.swapday, b = t.value; if (b === "") return;
    syncDraft();
    const A = draft.days[a], B = draft.days[+b];
    [A.title, B.title] = [B.title, A.title]; [A.ex, B.ex] = [B.ex, A.ex];
    render(); toast(`${A.label} ⇄ ${B.label}`); return;
  }
  if (t.dataset.pmove) {
    const [di, i] = t.dataset.pmove.split("|").map(Number), to = t.value; if (to === "") return;
    syncDraft();
    const ex = draft.days[di].ex.splice(i, 1)[0]; draft.days[+to].ex.push(ex);
    render(); toast(`${ex.name || "Exercice"} → ${draft.days[+to].label}`); return;
  }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.closest(".sets") || t.id === "note" || t.id === "duree") { typed[tkey(t.id)] = t.value; scheduleAutosave(); if (t.id !== "note") updateKcal(); }
  if (["pl-total", "rm-kg", "rm-reps", "wu-kg"].includes(t.id)) calcTools();
  if (tab === "programme" && t.closest("#view")) updateSaveBar();
  if (t.id === "pk-q") { picker.q = t.value; if (t.value.trim() && picker.filterM) { picker.filterM = ""; $$("[data-pm]").forEach(b => b.setAttribute("aria-pressed", b.dataset.pm === "")); } renderPickerList(); }
});

/* en revenant dans l'app après 20 min ou un changement de jour, on réaffiche la séance à faire */
let hiddenAt = 0;
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) { hiddenAt = Date.now(); await flushAutosave(); return; }
  const dayChanged = curDate !== today() && !manualNav;
  if (dayChanged || (hiddenAt && Date.now() - hiddenAt > 20 * 60 * 1000)) {
    if (picker || drag || (tab === "programme" && draft)) return;
    goToNext(); if (tab === "seance") render();
  }
});

/* ================= démarrage ================= */
render();
store.init();
